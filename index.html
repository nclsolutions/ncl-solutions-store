<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCL Solutions - Online Mobile Store</title>
  <meta name="description" content="Shop the latest smartphones and accessories at NCL Solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="NCL Solutions home">
        <img class="brand-logo" src="assets/brand-banner.jpg" alt="NCL Solutions logo">
        <span class="brand-name">NCL <strong>SOLUTIONS</strong></span>
      </a>
    </div>
  </header>

  <main>
    <section class="welcome-message" aria-labelledby="welcome-heading">
      <p class="promotion-label">Special promotion</p>
      <h1 id="welcome-heading">Welcome Back</h1>
      <p class="promotion-tagline">Your next favorite tech is waiting.</p>
    </section>

    <section class="promotion-banner" id="home" aria-label="NCL Solutions promotions">
      <img src="assets/promotion-poster.jpg" alt="NCL Solutions online mobile phone store promotion">
    </section>

    <section class="categories-section" aria-labelledby="categories-heading">
      <div class="categories-inner">
        <h2 id="categories-heading">Category</h2>
        <div class="category-grid">
          <article class="category-card">
            <img src="https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=640&q=80" alt="" loading="lazy">
            <h3>Smartphones</h3>
          </article>
          <article class="category-card">
            <img src="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?auto=format&fit=crop&w=640&q=80" alt="" loading="lazy">
            <h3>Tablets</h3>
          </article>
          <article class="category-card">
            <img src="https://images.unsplash.com/photo-1579586337278-3befd40fd17a?auto=format&fit=crop&w=640&q=80" alt="" loading="lazy">
            <h3>Smartwatches</h3>
          </article>
          <article class="category-card">
            <img src="https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=640&q=80" alt="" loading="lazy">
            <h3>Audio &amp; Earbuds</h3>
          </article>
          <article class="category-card">
            <img src="https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=640&q=80" alt="" loading="lazy">
            <h3>Phone Accessories</h3>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
