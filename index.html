<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCL Solutions - Online Mobile Store</title>
  <meta name="description" content="Shop the latest smartphones and accessories at NCL Solutions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="NCL Solutions home">
        <img class="brand-logo" src="assets/brand-banner.jpg" alt="NCL Solutions logo">
        <span class="brand-name">NCL <strong>SOLUTIONS</strong></span>
      </a>
      <div class="cart-summary" aria-live="polite" aria-atomic="true">
        <span>Cart</span>
        <span class="cart-count" id="cart-count">0</span>
      </div>
    </div>
  </header>

  <main>
    <section class="welcome-message" aria-labelledby="welcome-heading">
      <p class="promotion-label">Special promotion</p>
      <h1 id="welcome-heading">Welcome Back</h1>
      <p class="promotion-tagline">Your next favorite tech is waiting.</p>
    </section>

    <section class="promotion-banner" id="home" aria-label="NCL Solutions promotions">
      <img src="assets/promotion-poster.jpg" alt="NCL Solutions online mobile phone store promotion">
    </section>

    <section class="products-section" id="products">
      <div class="section-heading">
        <div>
          <p class="eyebrow">FEATURED COLLECTION</p>
          <h2>Popular Products</h2>
        </div>
      </div>

      <div class="product-grid">
        <article class="product-card" data-category="phone">
          <div class="product-image">
            <span class="badge">New</span>
            <button class="heart" type="button" aria-label="Add iPhone 16 Pro to favourites" aria-pressed="false">♡</button>
            <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=700&q=85" alt="iPhone 16 Pro">
          </div>
          <div class="product-info">
            <p class="product-brand">Apple</p>
            <h3>iPhone 16 Pro</h3>
            <div class="product-bottom"><strong>$1,099</strong><button class="add-button" type="button" aria-label="Add iPhone 16 Pro to cart">＋</button></div>
          </div>
        </article>

        <article class="product-card" data-category="phone">
          <div class="product-image">
            <span class="badge sale">-15%</span>
            <button class="heart" type="button" aria-label="Add Galaxy S25 to favourites" aria-pressed="false">♡</button>
            <img src="https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?auto=format&fit=crop&w=700&q=85" alt="Samsung Galaxy smartphone">
          </div>
          <div class="product-info">
            <p class="product-brand">Samsung</p>
            <h3>Galaxy S25</h3>
            <div class="product-bottom"><strong>$849</strong><button class="add-button" type="button" aria-label="Add Galaxy S25 to cart">＋</button></div>
          </div>
        </article>

        <article class="product-card" data-category="phone">
          <div class="product-image">
            <button class="heart" type="button" aria-label="Add Xiaomi 15 to favourites" aria-pressed="false">♡</button>
            <img src="https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?auto=format&fit=crop&w=700&q=85" alt="Xiaomi smartphone">
          </div>
          <div class="product-info">
            <p class="product-brand">Xiaomi</p>
            <h3>Xiaomi 15</h3>
            <div class="product-bottom"><strong>$699</strong><button class="add-button" type="button" aria-label="Add Xiaomi 15 to cart">＋</button></div>
          </div>
        </article>

        <article class="product-card" data-category="accessory">
          <div class="product-image">
            <span class="badge">New</span>
            <button class="heart" type="button" aria-label="Add Wireless Buds to favourites" aria-pressed="false">♡</button>
            <img src="https://images.unsplash.com/photo-1606220945770-b5b6c2c55bf1?auto=format&fit=crop&w=700&q=85" alt="Wireless earbuds">
          </div>
          <div class="product-info">
            <p class="product-brand">NCL Audio</p>
            <h3>Wireless Buds Pro</h3>
            <div class="product-bottom"><strong>$129</strong><button class="add-button" type="button" aria-label="Add Wireless Buds to cart">＋</button></div>
          </div>
        </article>
      </div>
    </section>
  </main>
  <div class="action-toast" id="action-toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="script.js"></script>
</body>
</html>
